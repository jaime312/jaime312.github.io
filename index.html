<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<meta name="description" content="Gazapo: encuentra el error escondido de la IA en el vídeo de hoy. Juega gratis en el navegador.">
<title>Gazapo · ¿Ves el fallo de la IA?</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://gazapo-media-gateway.jaime-v92.workers.dev" crossorigin>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
  body{background:#0b0f1a;color:#f7f8fc;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  #app{width:100%;max-width:480px;margin:0 auto;padding:14px 12px calc(20px + env(safe-area-inset-bottom))}
  header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
  .brand{font-size:20px;font-weight:900;letter-spacing:.5px}
  .brand span{color:#f59e0b}
  .pill{font-size:11px;font-weight:700;padding:6px 10px;border-radius:999px;background:#1b2236;color:#c9d3ee;border:1px solid #2b3552;white-space:nowrap}
  #stage{width:100%}
  #videoWrap{position:relative;width:100%;aspect-ratio:9/16;max-height:66vh;background:#000;border-radius:16px;overflow:hidden;border:1px solid #222d47}
  #gameVideo{width:100%;height:100%;object-fit:contain;display:block;background:#000}
  #marks{position:absolute;inset:0;pointer-events:none}
  .mark{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:3px solid #ff4d4d;box-shadow:0 0 0 2px rgba(0,0,0,.5);background:rgba(255,77,77,.12)}
  .mark.hit{border-color:#34d399;background:rgba(52,211,153,.18)}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#9fb0d8;background:#0b0f1a}
  #loading.hidden,#videoWrap.hidden{display:none}
  .controls{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
  button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .btn{min-height:44px;border:0;border-radius:12px;padding:10px 16px;font-weight:800;background:#252f4b;color:#fff}
  .btn:active{transform:translateY(1px);opacity:.9}
  .btn-primary{background:linear-gradient(135deg,#8b5cf6,#6366f1);color:#fff}
  #lives{font-size:18px;letter-spacing:2px;white-space:nowrap}
  #timer{font-variant-numeric:tabular-nums;font-weight:800;color:#f59e0b;min-width:52px;text-align:right}
  #hint{text-align:center;font-size:13px;color:#9fb0d8;margin:10px 0 0}
  #result{margin-top:14px;border-radius:16px;padding:16px;background:#141b2e;border:1px solid #2b3552}
  #result[hidden]{display:none}
  #resTitle{font-size:24px;font-weight:900;margin:0 0 6px}
  #resMeta{font-size:14px;color:#d5dcf0;margin:0 0 4px}
  #resExplain{font-size:13px;color:#9fb0d8;margin:6px 0 12px}
  .share{width:100%;margin-bottom:16px}
  .download{background:linear-gradient(135deg,#1d2742,#141b2e);border:1px solid #3a4770;border-radius:16px;padding:16px}
  .download h2{font-size:19px;margin:0 0 4px;font-weight:900}
  .download p{font-size:13px;color:#c4cee8;margin:0 0 14px;line-height:1.45}
  .store{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:12px;text-decoration:none;font-weight:800;font-size:15px;margin-top:10px;background:#000;color:#fff;border:1px solid #333}
  .store.play{background:#182132;border-color:#2d3b5c}
  .store small{font-size:10px;font-weight:600;opacity:.75;display:block}
  #toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#f7f8fc;color:#11182a;padding:10px 18px;border-radius:999px;font-weight:800;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:10;max-width:90vw;text-align:center}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  @media (max-width:360px){#app{padding:10px 8px}.brand{font-size:18px}}
</style>
</head>
<body>
<main id="app">
  <header>
    <div class="brand">🎬 GAZAPO<span>.</span></div>
    <div class="pill" id="edition">#000</div>
  </header>

  <section id="stage">
    <div id="videoWrap">
      <video id="gameVideo" playsinline webkit-playsinline loop muted preload="metadata"></video>
      <div id="marks"></div>
      <div id="loading" data-i18n="loading">Cargando el reto de hoy…</div>
    </div>
    <div class="controls">
      <button class="btn" id="btnPlay" type="button" data-i18n="pause">⏸ Pausa</button>
      <span id="lives" aria-label="intentos">❤❤❤</span>
      <span id="timer">0.0s</span>
    </div>
    <p id="hint" data-i18n="hint">Toca el vídeo donde esté el fallo · 3 intentos</p>
  </section>

  <section id="result" hidden>
    <h2 id="resTitle"></h2>
    <p id="resMeta"></p>
    <p id="resExplain"></p>
    <button class="btn btn-primary share" id="btnShare" type="button" data-i18n="share">📤 Compartir resultado</button>

    <div class="download">
      <h2 data-i18n="dlTitle">Guarda tu racha en la app</h2>
      <p data-i18n="dlBody">Juega al archivo de días anteriores, conserva tu racha y compite con tus amigos.</p>
      <a class="store" id="btnAppStore" href="https://apps.apple.com/es/app/gazapo/id6822689490" target="_blank" rel="noopener">
        <span>🍎 <span data-i18n="appStore">Descargar en App Store</span><small>iOS</small></span>
      </a>
      <a class="store play" id="btnPlayStore" href="https://play.google.com/store/apps/details?id=com.gazapo.app" target="_blank" rel="noopener">
        <span>▶️ <span data-i18n="playStore">Disponible en Google Play</span><small>Android</small></span>
      </a>
    </div>
  </section>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  "use strict";

  var I18N = {
    es: {
      loading:"Cargando el reto de hoy…", pause:"⏸ Pausa", play:"▶️ Reanudar",
      hint:"Toca el vídeo donde esté el fallo · 3 intentos",
      share:"📤 Compartir resultado", copied:"¡Texto copiado!",
      win:"¡Lo cazaste!", lose:"Se te escapó",
      hits:"Acertaste en ", tries:" intentos", attempts:" intentos", inTime:" en ", failText:"Agotaste los 3 intentos. ¿Lo ves ahora?",
      dlTitle:"Guarda tu racha en la app", dlBody:"Juega al archivo de días anteriores, conserva tu racha y compite con tus amigos.",
      appStore:"Descargar en App Store", playStore:"Disponible en Google Play",
      noMeta:"Sin pistas disponibles hoy", error:"No se pudo cargar el vídeo. Inténtalo de nuevo."
    },
    en: {
      loading:"Loading today's challenge…", pause:"⏸ Pause", play:"▶️ Play",
      hint:"Tap the video where the glitch is · 3 attempts",
      share:"📤 Share result", copied:"Text copied!",
      win:"You caught it!", lose:"It got away",
      hits:"Found it on try ", tries:"", attempts:" attempts", inTime:" in ", failText:"You used all 3 attempts. Can you see it now?",
      dlTitle:"Keep your streak in the app", dlBody:"Play the archive of past days, keep your streak and challenge your friends.",
      appStore:"Download on the App Store", playStore:"Get it on Google Play",
      noMeta:"No hints available today", error:"Could not load the video. Please try again."
    }
  };

  var LANG = /^es([-_]|$)/i.test(navigator.language || (navigator.languages && navigator.languages[0]) || "") ? "es" : "en";
  var T = I18N[LANG];
  document.documentElement.lang = LANG;
  function tr(key){ return T[key] !== undefined ? T[key] : I18N.es[key]; }
  function paintI18n(){
    var els = document.querySelectorAll("[data-i18n]");
    for (var i=0;i<els.length;i++) els[i].textContent = tr(els[i].getAttribute("data-i18n"));
  }
  paintI18n();

  var CF = "https://gazapo-media-gateway.jaime-v92.workers.dev";
  var APP_KEY = "gazapo_app_6ccwbcjiql1l1isk6tngq6vn";
  var CATALOG_URL = CF + "/catalogo.json?k=" + encodeURIComponent(APP_KEY);

  var video = document.getElementById("gameVideo");
  var wrap = document.getElementById("videoWrap");
  var marks = document.getElementById("marks");
  var loading = document.getElementById("loading");
  var btnPlay = document.getElementById("btnPlay");
  var livesEl = document.getElementById("lives");
  var timerEl = document.getElementById("timer");
  var hintEl = document.getElementById("hint");
  var result = document.getElementById("result");
  var resTitle = document.getElementById("resTitle");
  var resMeta = document.getElementById("resMeta");
  var resExplain = document.getElementById("resExplain");
  var toast = document.getElementById("toast");
  var editionEl = document.getElementById("edition");

  var current = null, zone = null, attempts = 0, used = 0, finished = false, startedAt = 0, timerId = null;

  function withKey(u){
    if (!u) return u;
    return u + (u.indexOf("?") >= 0 ? "&" : "?") + "k=" + encodeURIComponent(APP_KEY);
  }
  function showToast(msg){
    toast.textContent = msg; toast.classList.add("show");
    setTimeout(function(){ toast.classList.remove("show"); }, 2200);
  }

  // Zona del fallo: unión de los polígonos del sidecar (coordenadas normalizadas)
  function buildZone(sidecar){
    var map = sidecar && sidecar.zona && sidecar.zona.map;
    if (!map) return null;
    var frames = Object.keys(map).map(Number).sort(function(a,b){ return a-b; });
    if (!frames.length) return null;
    var minX=1, maxX=0, minY=1, maxY=0;
    frames.forEach(function(f){
      (map[String(f)] || []).forEach(function(p){
        if (!p || p.length < 2) return;
        var x = Number(p[0]), y = Number(p[1]);
        if (!isFinite(x) || !isFinite(y)) return;
        if (x<minX) minX=x; if (x>maxX) maxX=x;
        if (y<minY) minY=y; if (y>maxY) maxY=y;
      });
    });
    if (maxX <= minX || maxY <= minY) return null;
    var fps = Number((sidecar.zona && sidecar.zona.fps) || 30) || 30;
    return {
      cx:(minX+maxX)/2, cy:(minY+maxY)/2,
      r:Math.max(0.075, Math.max((maxX-minX)/2, (maxY-minY)/2) * 1.3),
      t0:frames[0]/fps, t1:frames[frames.length-1]/fps,
      explain: sidecar.explicacion || sidecar.gazapoCorto || ""
    };
  }

  function pickVideo(videos){
    var today = new Date().toISOString().slice(0,10);
    var chosen = null;
    for (var i=0;i<videos.length;i++){
      if (videos[i].fecha === today && videos[i].activo !== false){ chosen = videos[i]; break; }
    }
    if (!chosen){
      var past = videos.filter(function(v){ return v.fecha <= today && v.activo !== false; });
      chosen = past.length ? past[past.length-1] : (videos[0] || null);
    }
    return chosen;
  }

  function setup(v, index){
    current = v;
    editionEl.textContent = "#" + String(index+1).padStart(3,"0");
    video.src = withKey(v.src || (CF + "/" + v.id + ".mp4"));
    if (v.poster) video.poster = withKey(v.poster);
    video.load();
    var p = video.play();
    if (p && p.catch) p.catch(function(){});
    if (v.meta_path){
      fetch(withKey(v.meta_path), {cache:"no-store"})
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(s){ zone = buildZone(s); })
        .catch(function(){ zone = null; });
    }
  }

  function load(){
    fetch(CATALOG_URL, {cache:"no-store"})
      .then(function(r){ if(!r.ok) throw new Error("catalog"); return r.json(); })
      .then(function(cat){
        var videos = (cat && cat.videos) || [];
        if (!videos.length) throw new Error("empty");
        var v = pickVideo(videos);
        loading.classList.add("hidden");
        setup(v, videos.indexOf(v));
      })
      .catch(function(){
        loading.textContent = tr("error");
      });
  }

  function startTimer(){
    if (!startedAt) startedAt = Date.now();
    if (!timerId) timerId = setInterval(function(){
      if (!finished) timerEl.textContent = ((Date.now()-startedAt)/1000).toFixed(1) + "s";
    }, 100);
  }
  function paintLives(){
    var s = "";
    for (var i=0;i<3;i++) s += i < (3-used) ? "❤️" : "🖤";
    livesEl.textContent = s;
  }

  function isHit(nx,ny,t){
    if (!zone) return true;
    var dx=nx-zone.cx, dy=ny-zone.cy;
    var inside = Math.sqrt(dx*dx+dy*dy) <= zone.r;
    var inTime = !isFinite(zone.t0) || (t >= zone.t0-3 && t <= zone.t1+3);
    return inside && inTime;
  }

  function shareText(win){
    var n = used || 1;
    var sec = ((Date.now()-startedAt)/1000).toFixed(1).replace(".", LANG==="es"?",":".");
    var num = editionEl.textContent;
    if (LANG === "es"){
      return win
        ? "🎬 Gazapo " + num + "\n✅ Pillado al " + n + ".º intento en " + sec + "s\n¿Lo ves antes que yo? 👇\nhttps://jaime312.github.io"
        : "🎬 Gazapo " + num + "\n❌ Hoy la IA me ha engañado.\n¿Eres capaz de ver el fallo? 👇\nhttps://jaime312.github.io";
    }
    return win
      ? "🎬 Gazapo " + num + "\n✅ Spotted on try #" + n + " in " + sec + "s\nCan you beat my time? 👇\nhttps://jaime312.github.io"
      : "🎬 Gazapo " + num + "\n❌ The AI fooled me today.\nCan you spot the glitch? 👇\nhttps://jaime312.github.io";
  }

  function finish(win){
    if (finished) return;
    finished = true;
    video.pause();
    btnPlay.textContent = tr("play");
    if (timerId){ clearInterval(timerId); timerId = null; }
    resTitle.textContent = win ? tr("win") : tr("lose");
    var sec = ((Date.now()-startedAt)/1000).toFixed(1).replace(".", LANG==="es"?",":".");
    resMeta.textContent = win
      ? tr("hits") + used + tr("tries") + tr("inTime") + sec + "s"
      : tr("failText");
    resExplain.textContent = (zone && zone.explain) ? "👀 " + zone.explain : "";
    result.hidden = false;
    result.scrollIntoView({behavior:"smooth", block:"nearest"});
  }

  function copyText(text){
    if (navigator.clipboard && navigator.clipboard.writeText){
      return navigator.clipboard.writeText(text).then(function(){ showToast(tr("copied")); })
        .catch(function(){ fallbackCopy(text); });
    }
    fallbackCopy(text);
  }
  function fallbackCopy(text){
    var ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly","");
    ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); showToast(tr("copied")); } catch(e){}
    document.body.removeChild(ta);
  }

  wrap.addEventListener("click", function(ev){
    if (finished || !current || !video.videoWidth) return;
    startTimer();
    var r = wrap.getBoundingClientRect();
    var scale = Math.min(r.width/video.videoWidth, r.height/video.videoHeight);
    var dispW = video.videoWidth*scale, dispH = video.videoHeight*scale;
    var offX = (r.width-dispW)/2, offY = (r.height-dispH)/2;
    var nx = (ev.clientX - r.left - offX)/dispW;
    var ny = (ev.clientY - r.top - offY)/dispH;
    var hit = (nx>=0 && nx<=1 && ny>=0 && ny<=1) ? isHit(nx,ny,video.currentTime) : false;
    var dot = document.createElement("div");
    dot.className = "mark" + (hit ? " hit" : "");
    dot.style.left = (ev.clientX - r.left) + "px";
    dot.style.top = (ev.clientY - r.top) + "px";
    marks.appendChild(dot);
    used++;
    paintLives();
    if (hit) finish(true);
    else if (used >= 3) finish(false);
    else hintEl.textContent = LANG === "es" ? "¡Casi! Te quedan " + (3-used) + " intentos" : "Close! " + (3-used) + " attempts left";
  });

  btnPlay.addEventListener("click", function(){
    if (video.paused){
      var p = video.play();
      if (p && p.catch) p.catch(function(){});
      btnPlay.textContent = tr("pause");
      if (!finished) startTimer();
    } else {
      video.pause();
      btnPlay.textContent = tr("play");
    }
  });
  video.addEventListener("play", function(){ btnPlay.textContent = tr("pause"); });
  video.addEventListener("pause", function(){ btnPlay.textContent = tr("play"); });

  document.getElementById("btnShare").addEventListener("click", function(){ copyText(shareText(used>0 && !!document.querySelector(".mark.hit"))); });

  paintLives();
  load();
})();
</script>
</body>
</html>
